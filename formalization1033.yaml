      models: ["Claude Fable 5.1 (claude-fable-5-1)", "Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code"
      tool_setup: "An AI agent chose integer parameters by numerical search, wrote the Lean source, compiled it with lake against pinned Mathlib and iterated on compiler errors; the human directed the work."
      cost:
        wall_time: "about 1 hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The agent was asked to formalize every feasible solved Erdős problem it had identified; it read the CvB note and replaced the random subgraphs by circulant ones."
  spend_usd: "subscription-based"
  notes: "Proof and parameter choice by an AI agent (Claude) under the direction of the repository owner; the statement was taken verbatim from google-deepmind/formal-conjectures."

fidelity:
  divergences: "Integer parameters and circulant bipartite rules replace the note's real densities and random subgraphs; the resulting constant is 978/668 instead of 1.463878. The theorem statement is identical to formal-conjectures."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Statement compared verbatim with formal-conjectures 1033.lean; lake build passes with no sorry; #print axioms reports only propext, Classical.choice and Quot.sound. No independent human review."

alignment:
  namespace: "Erdos1033"
  statements:
    - source: "Erdős Problem 1033, main question"
      lean: "Erdos1033.erdos_1033"
      module: "Challenge1033"
      status: "proved"
      note: "Negation of: for every ε > 0, eventually every graph on n vertices with more than n²/4 edges has a triangle with degree sum at least (2(√3 - 1) - ε)n."

acknowledgements: "Mathlib; google-deepmind/formal-conjectures for the statement; the erdosproblems.com forum and W. CvB's note for the construction."
