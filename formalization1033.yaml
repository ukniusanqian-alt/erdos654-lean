    relationship: "other"
    note: "Source of the formal statement erdos_1033, reproduced verbatim (Apache-2.0); that file states it with sorry and contains no proof."

status:
  scope: >-
    Fully formalizes the negative answer to the main question of Erdős Problem 1033 (statement
    erdos_1033 of formal-conjectures). The optimal value of h(n), and the other variants in that
    file (Fan's lower bound 21n/16, the Erdős–Laskar construction), are not addressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
