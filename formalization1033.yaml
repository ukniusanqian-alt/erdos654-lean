# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Erdős Problem 1033: a butterfly blow-up beating 2(√3 - 1)"
  description: >-
    Lean 4 / Mathlib proof that the Bollobás–Erdős question of Erdős Problem 1033 has a negative
    answer. For every t ≥ 1 an explicit blow-up of the butterfly graph (two triangles sharing a
    vertex) on n = 668t vertices has 111561t² > n²/4 edges, and every triangle has degree sum
    exactly 978t, while 978/668 < 2(√3 - 1). Hence it is false that every graph on n vertices
    with more than n²/4 edges has a triangle with degree sum at least (2(√3 - 1) - o(1))n.
  authors:
    - "ukniusanqian-alt"
  license: "Apache-2.0"
  responsible_maintainers:
    - "ukniusanqian-alt"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C35"]

sources:
  - title: "Optimized density argument for Erdős 1033"
    authors:
      - "Wouter CvB"
    id: "https://woutercvb.github.io/Erdos1033_smalloptimization.pdf"
    type: "note"
    location: "https://woutercvb.github.io/Erdos1033_smalloptimization.pdf (July 27, 2026), Lemma 1"
    relationship: "adapts"
    note: "The note blows up the butterfly graph with real densities and random bipartite subgraphs (constant 1.463878). This formalization uses the same graph with integer part sizes (a = 6c) and explicit circulant bipartite rules, giving constant 978/668 = 1.46407…, still below 2(√3 - 1) = 1.46410…."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Erdős Problem #1033 and its forum thread"
    contributors:
      - name: "Béla Bollobás"
        role: "problem-proposer"
      - name: "Paul Erdős"
        role: "problem-proposer"
      - name: "Rickyc"
        role: "first butterfly blow-up construction (forum, with ChatGPT)"
    id: "https://www.erdosproblems.com/1033"
    type: "web post"
    location: "https://www.erdosproblems.com/forum/thread/1033"
    relationship: "background"
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
