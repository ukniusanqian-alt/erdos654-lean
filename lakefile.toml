name = "JspLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JspLean", "Challenge", "Solution", "Challenge1033", "Solution1033"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "JspLean"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "Challenge1033"
roots = ["Challenge1033"]

[[lean_lib]]
name = "Solution1033"
roots = ["Solution1033"]
